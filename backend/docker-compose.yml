version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: plietsche-postgres
    environment:
      POSTGRES_USER: plietsche
      POSTGRES_PASSWORD: plietsche
      POSTGRES_DB: plietschepluenn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plietsche -d plietschepluenn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
