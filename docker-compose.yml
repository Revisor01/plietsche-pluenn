version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: plietsche-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plietsche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plietsche_secret}
      POSTGRES_DB: plietschepluenn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plietsche -d plietschepluenn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plietsche-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://plietsche:${POSTGRES_PASSWORD:-plietsche_secret}@postgres:5432/plietschepluenn
      JWT_SECRET: ${JWT_SECRET}
      DOOR_QR_SECRET: ${DOOR_QR_SECRET}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plietsche-backend.rule=Host(`plietsche-pluenn.godsapp.de`)"
      - "traefik.http.services.plietsche-backend.loadbalancer.server.port=3000"
    networks:
      - traefik
      - internal

volumes:
  postgres_data:

networks:
  traefik:
    external: true
  internal:
    driver: bridge
