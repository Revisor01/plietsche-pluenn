# Lokale und dokumentarische Fassung: fremdes PocketBase-Abbild, Hooks und
# Migrationen als Bind-Mount vom Arbeitsverzeichnis. Zum Ausprobieren auf dem
# eigenen Rechner und um den Aufbau zu beschreiben.
#
# NICHT die Fassung, die in Produktion läuft. Dort gilt
# docker-compose.portainer.yml: eigenes Abbild aus pocketbase/Dockerfile, in
# dem Hooks und Migrationen stecken, und nur pb_data als Mount. Der Grund
# steht dort im Kopf.
#
# Routes via Traefik label → pb.plietsche-plünn.de (Punycode host).
# Apache (KeyHelp) → 127.0.0.1:8888 (Traefik) → this container.

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.21
    container_name: plietsche-pocketbase
    restart: unless-stopped
    command:
      - "--encryptionEnv=PB_ENCRYPTION_KEY"
      - "--http=0.0.0.0:8090"
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      # Nur für die Uhrzeiten der nächtlichen Aufgaben und für Logzeilen.
      # Tagesgrenze, Kalenderwoche und Jahreszahl hängen NICHT hieran — die
      # rechnet die Fachlogik aus der gepflegten Ladenzeitzone (store.timezone).
      # Geht diese Zeile auf einem anders eingerichteten Host verloren, bleiben
      # Punkte, Serien und Abzeichen deshalb trotzdem richtig.
      TZ: Europe/Berlin
    volumes:
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks
      - ./pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Dieselben Grenzen wie in docker-compose.portainer.yml — sonst beschriebe
    # diese Datei einen Aufbau, den es so nicht gibt. Ohne max-size waechst die
    # Protokolldatei unbegrenzt weiter, bis die Platte voll ist.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plietsche-pb.rule=Host(`pb.xn--plietsche-plnn-rsb.de`)"
      - "traefik.http.services.plietsche-pb.loadbalancer.server.port=8090"
    networks:
      - traefik

networks:
  traefik:
    external: true
