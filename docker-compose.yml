# Lokale Fassung mit Bind-Mounts aus pocketbase/; Produktion: docker-compose.portainer.yml. Start: docker compose up -d, dann http://localhost:8090/_/

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.4
    container_name: plietsche-pocketbase
    restart: unless-stopped
    command:
      - "--encryptionEnv=PB_ENCRYPTION_KEY"
      - "--http=0.0.0.0:8090"
    environment:
      # Genau 32 Zeichen (openssl rand -hex 16), sonst sind gespeicherte Einstellungen nach einem Neustart unlesbar.
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY setzen}
      # Nur für Cron-Uhrzeiten und Logs; Tage und Wochen rechnet die Fachlogik aus store.timezone.
      TZ: Europe/Berlin
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_hooks:/pb_hooks
      - ./pocketbase/pb_migrations:/pb_migrations
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Dieselben Grenzen wie in docker-compose.portainer.yml.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0
