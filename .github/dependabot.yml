version: 2

# Fast alles hängt am Expo-SDK und wird nur gemeinsam per `npx expo install expo@^<major> --fix` angehoben; hier nur SDK-unabhängige Pakete.

updates:
  # ── App-Abhängigkeiten (npm) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    ignore:
      # An das Expo SDK gebunden — nur gemeinsam über `expo install --fix`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      # Native Module: Version muss zum React-Native-Unterbau passen.
      - dependency-name: "react-native-*"
      # Muss zur PocketBase-Version des Servers passen, deshalb exakt gepinnt (TECH.md).
      - dependency-name: "pocketbase"
      # React-Typen folgen der React-Version aus dem SDK.
      - dependency-name: "@types/react"
      # TypeScript gibt das Expo-SDK vor (~6.0.3), daher nur Patch-Stände.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # ── Testwerkzeug im Repo-Root, unabhängig vom Expo-SDK ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    versioning-strategy: increase
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    ignore:
      # Integrationstests nutzen das SDK der ausgelieferten Apps, beide nur gemeinsam anheben.
      - dependency-name: "pocketbase"

  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # ── PocketBase-Abbild: in 0.x bricht schon ein Minor das Datenformat, daher nur Patches ──
  - package-ecosystem: docker
    directory: /pocketbase
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
