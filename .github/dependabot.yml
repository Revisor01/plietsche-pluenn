version: 2

# Achtung beim Erweitern: Der Großteil der Abhängigkeiten dieser App ist an die
# Expo-SDK-Version gebunden. Expo-Module, React, React Native und die nativen
# Bibliotheken (reanimated, screens, gesture-handler, svg, worklets, …) dürfen
# NICHT einzeln aktualisiert werden — sie werden ausschließlich über
# `npx expo install expo@^<major> --fix` gemeinsam angehoben. Einzelne Updates
# führen zu Versionskonflikten mit dem nativen Teil und brechen den Build.
#
# Deshalb sind hier nur die wenigen Pakete freigegeben, die unabhängig vom SDK
# leben. Der Rest ist explizit ausgenommen. TypeScript ist ein Sonderfall: Es
# haengt am SDK, ist aber kein Expo-Paket — dort sind nur Patch-Staende offen.

updates:
  # ── App-Abhängigkeiten (npm) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    ignore:
      # An das Expo SDK gebunden — nur gemeinsam über `expo install --fix`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      # Native Module: Version muss zum React-Native-Unterbau passen.
      - dependency-name: "react-native-*"
      # Muss zur PocketBase-Hauptversion auf dem Server passen (aktuell 0.22).
      # Wird bewusst exakt gepinnt — siehe TECH.md.
      - dependency-name: "pocketbase"
      # React-Typen folgen der React-Version aus dem SDK.
      - dependency-name: "@types/react"
      # TypeScript gibt das Expo SDK vor (`expo install --check` erwartet ~6.0.3).
      # Eine Hauptversion weiter (7.x, der Go-Compiler) ist von Expo nicht
      # unterstuetzt und war hier bereits unbemerkt eingezogen. Deshalb nur
      # Patch-Staende innerhalb 6.0 zulassen, Minor und Major blockieren.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # ── Testwerkzeug im Repo-Root (npm) ─────────────────────────────────────
  # Getrennt von /mobile: Hier liegt nur Vitest für die Backend-Hooks, das
  # nichts mit dem Expo-SDK zu tun hat und deshalb frei aktualisiert werden
  # darf.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies

  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
