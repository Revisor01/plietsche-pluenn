name: TestFlight

# Baut den aktuellen Stand des Branches in Xcode Cloud (Workflow „Plietsche
# Plünn TestFlight") und trägt danach die Testhinweise ein. Xcode Cloud
# signiert selbst und vergibt die Build-Nummer
# (mobile/ios/ci_scripts/ci_post_clone.sh); die Workflow-ID steht in der
# Repo-Variable XCODE_CLOUD_WORKFLOW. Die App spricht immer mit der Produktion:
# Xcode Cloud baut aus dem Repo-Stand, die Adresse steht in mobile/.env.example.
#
# Die Testhinweise entstehen aus den Commits seit dem letzten Lauf und stehen
# danach in TestFlight unter "Was gibt es Neues zu testen".

on:
  workflow_dispatch:
    inputs:
      hinweis:
        description: 'Was soll getestet werden? (leer = aus den Commits erzeugt)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  ASC_APP_ID: '6784690448'

jobs:
  bauen:
    name: In Xcode Cloud bauen
    uses: Revisor01/workflows/.github/workflows/xcode-cloud.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      workflow-id: ${{ vars.XCODE_CLOUD_WORKFLOW }}
    secrets:
      asc-key-id: ${{ secrets.ASC_KEY_ID }}
      asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
      asc-key-p8: ${{ secrets.ASC_KEY_P8_BASE64 }}

  hinweise:
    name: Testhinweise eintragen
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Historie, damit die Testhinweise aus den Commits seit
          # dem letzten gebauten Stand entstehen koennen.
          fetch-depth: 0

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Letzten gebauten Stand ermitteln
        id: vorher
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Commit des letzten erfolgreichen Laufs dieses Workflows. Ein
        # Git-Tag scheidet aus: Der eingebaute Token darf keine Referenz
        # setzen, die auf Workflow-Dateien zeigt.
        #
        # Der Branch gehoert in die Abfrage: Ohne ihn zaehlt auch ein Lauf von
        # einem Nebenzweig als Vergleichsstand, und die Hinweise entstuenden
        # dann aus einem Bereich, der mit diesem Zweig nichts zu tun hat.
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/testflight.yml/runs?status=success&branch=${GITHUB_REF_NAME}&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or [{}]; print(r[0].get('head_sha',''))")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Letzter erfolgreicher Stand: ${SHA:-keiner}"

      - name: Testhinweise zusammenstellen
        id: hinweise
        env:
          VORGABE: ${{ inputs.hinweis }}
          SEIT_COMMIT: ${{ steps.vorher.outputs.sha }}
        # Aus den Commits seit dem letzten Upload. Dasselbe Skript bedient den
        # Google-Play-Workflow, nur mit anderer Laengengrenze.
        run: |
          python3 .github/scripts/release-notes.py testflight > /tmp/notes.txt
          {
            echo 'text<<HINWEIS_ENDE'
            cat /tmp/notes.txt
            echo 'HINWEIS_ENDE'
          } >> "$GITHUB_OUTPUT"
          echo "--- Testhinweise ---"
          cat /tmp/notes.txt

      - name: Testhinweise in TestFlight eintragen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMMER: ${{ needs.bauen.outputs.build-nummer }}
          HINWEISE: ${{ steps.hinweise.outputs.text }}
          ASC_APP_ID: ${{ env.ASC_APP_ID }}
        # Der Baustein meldet den Build, sobald er in App Store Connect liegt;
        # das Nachfassen bleibt für den Fall, dass die Suche nachhinkt.
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request, urllib.error

          key_id = os.environ['ASC_KEY_ID']
          issuer = os.environ['ASC_ISSUER_ID']
          app_id = os.environ.get('ASC_APP_ID') or '6784690448'
          nummer = os.environ['BUILD_NUMMER']
          hinweise = os.environ['HINWEISE']
          key_path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')

          def b64url(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b'=').decode()

          def entpacke(der):
              i = 2 if der[1] < 0x80 else 3 + (der[1] & 0x7F) - 1
              werte, pos = [], i
              for _ in range(2):
                  laenge = der[pos + 1]
                  werte.append(int.from_bytes(der[pos + 2:pos + 2 + laenge], 'big'))
                  pos += 2 + laenge
              return b''.join(w.to_bytes(32, 'big') for w in werte)

          def token():
              now = int(time.time())
              h = b64url(json.dumps({'alg': 'ES256', 'kid': key_id, 'typ': 'JWT'},
                                    separators=(',', ':')).encode())
              p = b64url(json.dumps({'iss': issuer, 'iat': now, 'exp': now + 900,
                                     'aud': 'appstoreconnect-v1'},
                                    separators=(',', ':')).encode())
              si = f'{h}.{p}'
              der = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', key_path],
                                   input=si.encode(), capture_output=True, check=True).stdout
              return f'{si}.{b64url(entpacke(der))}'

          def anfrage(pfad, methode='GET', koerper=None):
              url = f'https://api.appstoreconnect.apple.com{pfad}'
              daten = json.dumps(koerper).encode() if koerper else None
              req = urllib.request.Request(url, data=daten, method=methode, headers={
                  'Authorization': f'Bearer {token()}',
                  'Content-Type': 'application/json',
              })
              try:
                  with urllib.request.urlopen(req) as a:
                      roh = a.read()
                      return json.loads(roh) if roh else {}
              except urllib.error.HTTPError as e:
                  print(f'  HTTP {e.code}: {e.read().decode()[:300]}')
                  return None

          # Auf den frisch hochgeladenen Build warten.
          build_id = None
          for versuch in range(20):
              d = anfrage(f'/v1/builds?filter%5Bapp%5D={app_id}'
                          f'&filter%5Bversion%5D={nummer}&limit=1')
              if d and d.get('data'):
                  build_id = d['data'][0]['id']
                  print(f'Build {nummer} gefunden: {build_id}')
                  break
              print(f'  Build {nummer} noch nicht sichtbar ({versuch + 1}/20) …')
              time.sleep(30)

          if not build_id:
              print('Build nicht rechtzeitig aufgetaucht — die Hinweise bitte '
                    'in App Store Connect von Hand eintragen.')
              raise SystemExit(0)

          # Vorhandene Lokalisierung suchen, sonst anlegen.
          vorhanden = anfrage(f'/v1/builds/{build_id}/betaBuildLocalizations')
          eintrag = None
          for l in (vorhanden or {}).get('data', []):
              if l['attributes'].get('locale') == 'de-DE':
                  eintrag = l['id']
                  break

          if eintrag:
              anfrage(f'/v1/betaBuildLocalizations/{eintrag}', 'PATCH', {
                  'data': {'type': 'betaBuildLocalizations', 'id': eintrag,
                           'attributes': {'whatsNew': hinweise}}})
              print('Testhinweise aktualisiert.')
          else:
              anfrage('/v1/betaBuildLocalizations', 'POST', {
                  'data': {'type': 'betaBuildLocalizations',
                           'attributes': {'locale': 'de-DE', 'whatsNew': hinweise},
                           'relationships': {'build': {'data': {'type': 'builds',
                                                                'id': build_id}}}}})
              print('Testhinweise eingetragen.')
          print('---')
          print(hinweise)
          PY

      - name: Zusammenfassung
        if: always()
        env:
          BUILD_NUMMER: ${{ needs.bauen.outputs.build-nummer }}
          HINWEISE: ${{ steps.hinweise.outputs.text }}
        run: |
          {
            echo "## TestFlight"
            echo ""
            echo "**Build ${BUILD_NUMMER}** aus \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "### Zu testen"
            echo ""
            echo "${HINWEISE:-–}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
