name: Veröffentlichen

# Bringt eine Fassung in den App Store und zu Google Play — beide Plattformen
# in einem Lauf, damit die Staende nicht auseinanderlaufen.
#
# Anders als die Testkanaele laesst sich das nicht zurueckholen. Deshalb muss
# die Versionsnummer beim Start abgetippt werden: Sie wird gegen app.json
# geprueft, und bei einer Abweichung bricht der Lauf ab, bevor irgendetwas
# gebaut wird. Ein Fehlklick allein reicht also nicht.
#
# Was danach noch von Hand passiert:
#   - iOS: Die Fassung wird zur Pruefung eingereicht, nicht automatisch
#     freigegeben. Apple prueft, danach gibst du sie in App Store Connect frei.
#   - Android: Geht direkt in die Produktionsspur; Google startet die Pruefung
#     selbst.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version zur Bestaetigung abtippen (z. B. 1.0.1) — muss zu app.json passen'
        required: true
      plattformen:
        description: 'Was soll veroeffentlicht werden?'
        type: choice
        options:
          - beide
          - nur iOS
          - nur Android
        default: beide
      hinweis:
        description: 'Was ist neu? (leer = aus den Commits erzeugt)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TEAM_ID: J459G9CJT5
  PACKAGE: de.godsapp.plietschepluenn
  ASC_APP_ID: '6784690448'

jobs:
  # ── Sicherung vor dem Bauen ────────────────────────────────────
  pruefung:
    name: Version pruefen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pruef.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Abgetippte Version gegen app.json halten
        id: pruef
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          ECHT=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")
          echo "In app.json steht: $ECHT"
          echo "Abgetippt wurde:   $EINGABE"
          if [ "$ECHT" != "$EINGABE" ]; then
            echo "::error::Die Versionen stimmen nicht ueberein. Entweder in app.json anheben oder richtig abtippen — es wurde nichts gebaut."
            exit 1
          fi
          echo "version=$ECHT" >> "$GITHUB_OUTPUT"

      # Ohne setup-node laeuft der Job auf der Node-Version, die der Runner
      # zufaellig mitbringt. Vitest 5 verlangt >=22.12 — faellt der Runner
      # darunter, bricht dieser Schritt ab, und zwar der einzige, der vor dem
      # App Store und der Produktionsspur noch pruefen koennte.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Tests
        run: |
          npm ci
          npm test

  # ── iOS ────────────────────────────────────────────────────────
  ios:
    name: App Store
    needs: pruefung
    if: ${{ inputs.plattformen != 'nur Android' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Neuestes stabiles Xcode waehlen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Naechste Build-Nummer ermitteln
        id: version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ env.ASC_APP_ID }}
        run: python3 .github/scripts/asc-build-number.py >> "$GITHUB_OUTPUT"

      - name: Build-Nummer eintragen
        working-directory: mobile
        env:
          BUILD_NUMMER: ${{ steps.version.outputs.build }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('app.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['expo'].setdefault('ios', {})['buildNumber'] = os.environ['BUILD_NUMMER']
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f"Version {d['expo']['version']} ({os.environ['BUILD_NUMMER']})")
          PY

      - name: Natives Projekt erzeugen
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_PB_URL=https://pb.xn--plietsche-plnn-rsb.de" >> .env
          npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods installieren
        working-directory: mobile/ios
        run: pod install

      - name: Signing-Keychain einrichten
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain >/dev/null
          rm dist.p12

      - name: Archiv bauen
        working-directory: mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -o pipefail
          SCHEME=$(ls -d *.xcworkspace | head -1 | sed 's/\.xcworkspace$//')
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: IPA exportieren
        working-directory: mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions-ci.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions-ci.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -10

      - name: Hochladen
        working-directory: mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Zusammenfassung
        if: always()
        env:
          BUILD_NUMMER: ${{ steps.version.outputs.build }}
        run: |
          {
            echo "## App Store"
            echo ""
            echo "Version ${{ needs.pruefung.outputs.version }}, Build ${BUILD_NUMMER} hochgeladen."
            echo ""
            echo "Die Fassung ist **noch nicht veroeffentlicht**: Nach der Verarbeitung"
            echo "in App Store Connect zur Pruefung einreichen und nach Apples Freigabe"
            echo "veroeffentlichen."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Android ────────────────────────────────────────────────────
  android:
    name: Google Play
    needs: pruefung
    if: ${{ inputs.plattformen != 'nur iOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle-Zwischenspeicher
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Naechste Versionsnummer ermitteln
        id: version
        env:
          GPLAY_SA_JSON_BASE64: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
        run: |
          echo "$GPLAY_SA_JSON_BASE64" | base64 --decode > /tmp/gplay-sa.json
          python3 .github/scripts/play-version.py /tmp/gplay-sa.json "$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Versionsnummer eintragen
        working-directory: mobile
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('app.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['expo'].setdefault('android', {})['versionCode'] = int(os.environ['VERSION_CODE'])
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f"Version {d['expo']['version']} (versionCode {os.environ['VERSION_CODE']})")
          PY

      - name: Natives Projekt erzeugen
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_PB_URL=https://pb.xn--plietsche-plnn-rsb.de" >> .env
          npx expo prebuild --platform android --clean --no-install

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes Paket bauen
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/android-signing.py"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
          ./gradlew bundleRelease --no-daemon --build-cache \
            "-PPP_KEYSTORE_PATH=/tmp/release.jks" \
            "-PPP_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PPP_KEY_ALIAS=$KEY_ALIAS" \
            "-PPP_KEY_PASSWORD=$KEY_PASS"

      - name: Letzte Veroeffentlichung ermitteln
        id: vorher
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Commit der letzten Veroeffentlichung, als Vergleichspunkt fuer
        # die Aenderungshinweise. Der Branch gehoert in die Abfrage: Ohne ihn
        # zaehlt auch ein Lauf von einem Nebenzweig, und in der Produktionsspur
        # stuenden Hinweise aus einem fremden Bereich.
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?status=success&branch=${GITHUB_REF_NAME}&per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or [{}]; print(r[0].get('head_sha',''))")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Aenderungshinweise zusammenstellen
        env:
          VORGABE: ${{ inputs.hinweis }}
          SEIT_COMMIT: ${{ steps.vorher.outputs.sha }}
        run: |
          python3 .github/scripts/release-notes.py play > /tmp/notes.txt
          cat /tmp/notes.txt

      - name: In die Produktionsspur stellen
        run: |
          AAB=$(ls mobile/android/app/build/outputs/bundle/release/*.aab | head -1)
          python3 .github/scripts/upload-play.py /tmp/gplay-sa.json "$AAB" \
            /tmp/notes.txt production commit

      - name: Zusammenfassung
        if: always()
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          {
            echo "## Google Play"
            echo ""
            echo "Version ${{ needs.pruefung.outputs.version }} (versionCode ${VERSION_CODE})"
            echo "in der Produktionsspur, sofort fuer alle."
            echo ""
            echo "Google startet die Pruefung selbst; bis zur Auslieferung dauert es"
            echo "ueblicherweise einige Stunden."
          } >> "$GITHUB_STEP_SUMMARY"
