name: Veröffentlichen

# Ein Probelauf traegt die Marke [Probelauf] im Titel; "Letzte
# Veroeffentlichung ermitteln" ueberspringt solche Laeufe.
run-name: >-
  ${{ inputs.probelauf && '[Probelauf] ' || '' }}Veröffentlichen ${{ inputs.version }}

# Bringt eine Fassung in den App Store und zu Google Play — beide Plattformen
# in einem Lauf, damit die Staende nicht auseinanderlaufen.
#
# Anders als die Testkanaele laesst sich das nicht zurueckholen. Deshalb muss
# die Versionsnummer beim Start abgetippt werden: Sie wird gegen app.json
# geprueft, und bei einer Abweichung bricht der Lauf ab, bevor irgendetwas
# gebaut wird. Ein Fehlklick allein reicht also nicht.
#
# Was danach noch von Hand passiert:
#   - iOS: Die Fassung landet in App Store Connect. Dort zur Pruefung
#     einreichen; nach Apples Freigabe gibst du sie frei.
#   - Android: Geht in die Produktionsspur; Google startet die Pruefung selbst.
#     Bei Freigabe "draft" landet die Fassung stattdessen als Entwurf in der
#     Play Console und wird dort von Hand freigegeben — so muss die allererste
#     Veroeffentlichung laufen.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version zur Bestaetigung abtippen (z. B. 1.0.1) — muss zu app.json passen'
        required: true
      plattformen:
        description: 'Was soll veroeffentlicht werden?'
        type: choice
        options:
          - beide
          - nur iOS
          - nur Android
        default: beide
      freigabe:
        description: 'Android: completed = geht sofort in die Produktionsspur. draft = Entwurf in der Play Console (fuer die ERSTE Veroeffentlichung noetig).'
        type: choice
        options:
          - completed
          - draft
        # Vorgabe completed, weil das der Normalfall einer Veroeffentlichung ist.
        # Fuer die allererste Veroeffentlichung muss hier draft gewaehlt werden:
        # Solange die App bei Google unveroeffentlicht ist, lehnt die API jeden
        # anderen Status ab ("Only releases with status draft may be created on
        # draft app."). Der Lauf scheiterte sonst nach dem fertigen Build.
        default: completed
      hinweis:
        description: 'Was ist neu? (leer = aus den Commits erzeugt)'
        required: false
        default: ''
      probelauf:
        description: 'Probelauf: Android bauen, hochladen und pruefen, dann verwerfen; iOS entfaellt, nichts wird veroeffentlicht'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: de.godsapp.plietschepluenn

jobs:
  # ── Sicherung vor dem Bauen ────────────────────────────────────
  pruefung:
    name: Version pruefen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pruef.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Abgetippte Version gegen app.json halten
        id: pruef
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          ECHT=$(python3 -c "import json;print(json.load(open('mobile/app.json'))['expo']['version'])")
          echo "In app.json steht: $ECHT"
          echo "Abgetippt wurde:   $EINGABE"
          if [ "$ECHT" != "$EINGABE" ]; then
            echo "::error::Die Versionen stimmen nicht ueberein. Entweder in app.json anheben oder richtig abtippen — es wurde nichts gebaut."
            exit 1
          fi
          echo "version=$ECHT" >> "$GITHUB_OUTPUT"

      # Ohne setup-node laeuft der Job auf der Node-Version, die der Runner
      # zufaellig mitbringt. Vitest 5 verlangt >=22.12 — faellt der Runner
      # darunter, bricht dieser Schritt ab, und zwar der einzige, der vor dem
      # App Store und der Produktionsspur noch pruefen koennte.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Tests
        run: |
          npm ci
          npm test

  # ── iOS ────────────────────────────────────────────────────────
  ios:
    name: App Store
    needs: pruefung
    if: ${{ inputs.plattformen != 'nur Android' && !inputs.probelauf }}
    # Xcode Cloud baut den Kopf des Branches, signiert selbst und vergibt die
    # Build-Nummer; die Workflow-ID steht in der Repo-Variable XCODE_CLOUD_WORKFLOW.
    uses: Revisor01/workflows/.github/workflows/xcode-cloud.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      workflow-id: ${{ vars.XCODE_CLOUD_WORKFLOW }}
    secrets:
      asc-key-id: ${{ secrets.ASC_KEY_ID }}
      asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
      asc-key-p8: ${{ secrets.ASC_KEY_P8_BASE64 }}

  ios-zusammenfassung:
    needs: [pruefung, ios]
    if: ${{ always() && inputs.plattformen != 'nur Android' && !inputs.probelauf }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zusammenfassung
        env:
          VERSION: ${{ needs.pruefung.outputs.version }}
          BUILD_NUMMER: ${{ needs.ios.outputs.build-nummer }}
          ERGEBNIS: ${{ needs.ios.result }}
        run: |
          {
            echo "## App Store"
            echo ""
            if [ "$ERGEBNIS" != "success" ]; then
              echo "**Nicht in App Store Connect** (Xcode Cloud: ${ERGEBNIS})."
            else
              echo "Version ${VERSION}, Build ${BUILD_NUMMER} liegt in App Store Connect."
              echo ""
              echo "Die Fassung ist **noch nicht veroeffentlicht**: Nach der Verarbeitung"
              echo "in App Store Connect zur Pruefung einreichen und nach Apples Freigabe"
              echo "veroeffentlichen."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Android ────────────────────────────────────────────────────
  android:
    name: Google Play bauen
    needs: pruefung
    if: ${{ inputs.plattformen != 'nur iOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      code: ${{ steps.version.outputs.code }}
      hinweise: ${{ steps.hinweise.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle-Zwischenspeicher
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Naechste Versionsnummer ermitteln
        id: version
        env:
          GPLAY_SA_JSON_BASE64: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
        run: |
          echo "$GPLAY_SA_JSON_BASE64" | base64 --decode > /tmp/gplay-sa.json
          python3 .github/scripts/play-version.py /tmp/gplay-sa.json "$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Versionsnummer eintragen
        working-directory: mobile
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('app.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          code = int(os.environ['VERSION_CODE'])
          if os.environ.get('PROBELAUF') == 'true':
              # Weit nach oben, damit der Upload nicht an einer vergebenen
              # Nummer scheitert; der Probelauf verbraucht sie nicht.
              code += 10000
          d['expo'].setdefault('android', {})['versionCode'] = code
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f"Version {d['expo']['version']} (versionCode {code})")
          PY

      - name: Natives Projekt erzeugen
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_PB_URL=https://pb.xn--plietsche-plnn-rsb.de" >> .env
          npx expo prebuild --platform android --clean --no-install

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes Paket bauen
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/android-signing.py"
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
          ./gradlew bundleRelease --no-daemon --build-cache \
            "-PPP_KEYSTORE_PATH=/tmp/release.jks" \
            "-PPP_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PPP_KEY_ALIAS=$KEY_ALIAS" \
            "-PPP_KEY_PASSWORD=$KEY_PASS"

      - name: Letzte Veroeffentlichung ermitteln
        id: vorher
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Commit der letzten Veroeffentlichung, als Vergleichspunkt fuer
        # die Aenderungshinweise; nur dieser Branch, ohne Probelaeufe (die
        # veroeffentlichen nichts, siehe run-name).
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?status=success&branch=${GITHUB_REF_NAME}&per_page=50" \
            | python3 -c "
          import json, sys
          for run in json.load(sys.stdin).get('workflow_runs') or []:
              if '[Probelauf]' in (run.get('display_title') or ''):
                  continue
              print(run.get('head_sha', ''))
              break
          ")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Aenderungshinweise zusammenstellen
        id: hinweise
        env:
          VORGABE: ${{ inputs.hinweis }}
          SEIT_COMMIT: ${{ steps.vorher.outputs.sha }}
        run: |
          python3 .github/scripts/release-notes.py play > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"
          {
            echo 'text<<HINWEIS_ENDE'
            cat "$RUNNER_TEMP/notes.txt"
            echo 'HINWEIS_ENDE'
          } >> "$GITHUB_OUTPUT"

      - name: Paket für den Upload bereitstellen
        run: |
          AAB=$(find mobile/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Paket: $AAB"
          mkdir -p "$RUNNER_TEMP/aab" && cp "$AAB" "$RUNNER_TEMP/aab/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab
          path: ${{ runner.temp }}/aab/
          if-no-files-found: error
          retention-days: 1

  android-upload:
    # In die Produktionsspur über den Baustein; Anteil 1 heißt wie bisher
    # sofort an alle. Beim Probelauf wird die Bearbeitung verworfen.
    needs: [android]
    uses: Revisor01/workflows/.github/workflows/play-upload.yml@97284908c8f72a4e54b593e2c43b56377eda0606 # 1.4.0
    with:
      paket: de.godsapp.plietschepluenn
      tracks: production
      status: ${{ inputs.freigabe }}
      production-anteil: "1"
      release-notes: ${{ needs.android.outputs.hinweise }}
      artefakt: aab
      dry-run: ${{ inputs.probelauf }}
    secrets:
      dienstkonto: ${{ secrets.GPLAY_SA_JSON_BASE64 }}

  android-zusammenfassung:
    needs: [pruefung, android, android-upload]
    if: ${{ always() && inputs.plattformen != 'nur iOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zusammenfassung
        env:
          VERSION: ${{ needs.pruefung.outputs.version }}
          VERSION_CODE: ${{ needs.android.outputs.code }}
          UPLOAD: ${{ needs.android-upload.result }}
          PROBELAUF: ${{ inputs.probelauf }}
          FREIGABE: ${{ inputs.freigabe }}
        run: |
          {
            echo "## Google Play"
            echo ""
            if [ "$UPLOAD" != "success" ]; then
              echo "**Nicht hochgeladen** (Upload: ${UPLOAD})."
            elif [ "$PROBELAUF" = "true" ]; then
              echo "**Probelauf** — Version ${VERSION} gebaut, hochgeladen und geprüft, dann"
              echo "verworfen. Nichts veroeffentlicht, Nummer unverbraucht."
            else
              echo "Version ${VERSION} (versionCode ${VERSION_CODE})"
              echo "in der Produktionsspur."
              echo ""
              if [ "$FREIGABE" = "draft" ]; then
                echo "Status **Entwurf**: Die Fassung liegt in der Play Console und ist"
                echo "noch bei niemandem. Dort freigeben — bei der ersten Veroeffentlichung"
                echo "muessen vorher Store-Eintrag, Inhaltsbewertung und Datenschutzangaben"
                echo "vollstaendig sein."
              else
                echo "Status **freigegeben**, sofort fuer alle. Google startet die Pruefung"
                echo "selbst; bis zur Auslieferung dauert es ueblicherweise einige Stunden."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
