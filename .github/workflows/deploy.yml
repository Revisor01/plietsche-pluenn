name: Deploy Backend

# Baut das PocketBase-Abbild, stößt den Webhook an und prüft danach, ob der neue Stand wirklich läuft.

on:
  push:
    branches: [main]
    paths:
      - 'pocketbase/**'
      - 'docker-compose.portainer.yml'
      # Die Workflow-Datei gehört dazu, sonst löst eine Änderung am Ablauf keinen Lauf aus.
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy-verify.py'
  # Für den Störfall und für den ersten Lauf von Hand.
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig, aber nicht abbrechen: ein angefangener Deploy wird zu Ende geprüft.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASIS_URL: https://pb.xn--plietsche-plnn-rsb.de

jobs:
  # Test-Gate per `needs` statt workflow_run, weil workflow_run gegen den Standard-Branch statt den Commit läuft.
  tests:
    name: Backend-Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      # Gegen das echte Binary, ob PocketBase Migrationen und Hooks überhaupt annimmt.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/integration/pocketbase-binary.mjs') }}

      - name: Integrationstests (echte Laufzeit)
        run: npm run test:integration

  kontext:
    name: Build-Kontext prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vollständigkeit vor dem Push, sonst startet PocketBase gesund, aber ohne Hooks oder Schema.
      - name: Prüfen, dass der Build-Kontext vollständig ist
        run: |
          set -eu
          fehlt=0
          for datei in \
            pocketbase/pb_hooks/scan.pb.js \
            pocketbase/pb_hooks/push.pb.js \
            pocketbase/pb_hooks/defaults.pb.js \
            pocketbase/pb_hooks/cron.pb.js \
            pocketbase/pb_hooks/version.pb.js \
            pocketbase/pb_hooks/lib/points.js \
            pocketbase/pb_hooks/lib/push.js \
            pocketbase/Dockerfile
          do
            if [ ! -s "$datei" ]; then
              echo "fehlt oder leer: $datei"
              fehlt=1
            fi
          done
          [ "$fehlt" -eq 0 ] || { echo "Der Build-Kontext ist unvollständig."; exit 1; }

          # Der Snapshot namentlich, der Rest über eine Untergrenze, sonst vergisst man die Liste.
          [ -s pocketbase/pb_migrations/1790500000_collections_snapshot.js ] \
            || { echo "Der Sammlungs-Snapshot fehlt"; exit 1; }
          n=$(find pocketbase/pb_migrations -name '*.js' -type f | wc -l)
          [ "$n" -ge 3 ] || { echo "Nur $n Migrationen gefunden – erwartet werden mindestens 3"; exit 1; }
          echo "$n Migrationen und alle Hook-Dateien sind da"

  # Ohne always(). Rote Tests, kein Deploy — keine Hintertür.
  image:
    name: Abbild
    needs: [tests, kontext]
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/revisor01/plietsche-pluenn/pocketbase
      kontext: ./pocketbase
      # :latest zieht der Stack, der Commit-SHA bleibt als Weg zurück stehen.
      tags: |
        type=raw,value=latest
        type=sha,prefix=,format=long
      # Landet als lib/build.js in /pb_hooks; GET /api/pp/version liefert ihn aus.
      build-args: PP_COMMIT=${{ github.sha }}

  deploy:
    name: Ausliefern
    needs: image
    uses: Revisor01/workflows/.github/workflows/portainer-deploy.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      pruef-url: https://pb.xn--plietsche-plnn-rsb.de/api/pp/version
      revision-feld: .commit
    secrets:
      webhook: ${{ secrets.PORTAINER_WEBHOOK_URL }}

  verify:
    name: Neuen Stand prüfen
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Ein Health-Check reicht nicht; was geprüft wird, steht im Kopf des Skripts.
      - name: Prüfen, ob der neue Stand angekommen ist
        # Der Hook-Commit, sonst ist eine Änderung nur an pb_hooks nicht messbar.
        env:
          ERWARTETER_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/deploy-verify.py "$BASIS_URL"
