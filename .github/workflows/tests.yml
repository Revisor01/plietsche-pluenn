name: Tests

# Backend-Tests und Typprüfung bei jedem Push und Pull Request auf main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend-Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # hasVisitToday() rechnet in der lokalen Zeitzone, die Vitest-Konfiguration setzt sie fest.
      - name: Tests
        run: npm test

  # Gegen das echte, per SHA256 geprüfte PocketBase-Binary; fängt, was der Harness nicht sieht.
  integration:
    name: Echte Laufzeit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      # Vor dem Cache: npm ci leert node_modules/ und damit auch den Cache-Ordner.
      - run: npm ci

      # Schlüssel an Version und Prüfsummen.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/pocketbase
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/integration/pocketbase-binary.mjs') }}

      - name: Integrationstests
        run: npm run test:integration

  app:
    name: App-Typprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Die Expo-Peers lösen sich mit npm 10 nicht strikt auf.
      - run: npm ci --legacy-peer-deps
        working-directory: mobile

      - name: TypeScript
        run: npx tsc --noEmit
        working-directory: mobile
