name: Google Play

# Die Marke [Probelauf] im Titel lässt die Ermittlung des letzten Stands diese Läufe überspringen.
run-name: >-
  ${{ inputs.probelauf && '[Probelauf] ' || '' }}Google Play ${{ inputs.spur }}

# Signiertes Android-Paket in eine Play-Testspur; der Probelauf verwirft am Ende die Bearbeitung.

on:
  workflow_dispatch:
    inputs:
      spur:
        description: 'Ziel-Spur bei Google Play'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      freigabe:
        description: 'completed = geht sofort an die Spur. draft = landet als Entwurf in der Play Console (noetig, solange die App dort noch nie veroeffentlicht wurde).'
        type: choice
        options:
          - completed
          - draft
        # completed, damit Testfassungen bei den Tester:innen ankommen; draft nur für die erste Einreichung in production.
        default: completed
      hinweis:
        description: 'Was soll getestet werden? (leer = aus den Commits erzeugt)'
        required: false
        default: ''
      backend:
        description: 'Backend-Adresse (leer = Produktion)'
        required: false
        default: ''
      probelauf:
        description: 'Probelauf: alles bauen und pruefen, aber nichts veroeffentlichen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

env:
  PACKAGE: de.godsapp.plietschepluenn

jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      code: ${{ steps.version.outputs.code }}
      hinweise: ${{ steps.hinweise.outputs.text }}

    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle-Zwischenspeicher
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Naechste Versionsnummer ermitteln
        id: version
        env:
          GPLAY_SA_JSON_BASE64: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
          PROBELAUF: ${{ inputs.probelauf }}
        # Nummer aus Google Play; im Probelauf künstlich hoch, sie wird nicht verbraucht.
        run: |
          echo "$GPLAY_SA_JSON_BASE64" | base64 --decode > /tmp/gplay-sa.json
          python3 .github/scripts/play-version.py /tmp/gplay-sa.json "$PACKAGE" \
            >> "$GITHUB_OUTPUT"

      - name: Version und Nummer eintragen
        working-directory: mobile
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('app.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          code = int(os.environ['VERSION_CODE'])
          if os.environ.get('PROBELAUF') == 'true':
              code += 10000
          d['expo'].setdefault('android', {})['versionCode'] = code
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f"Version {d['expo']['version']} (versionCode {code})")
          PY

      - name: Firebase-Konfiguration ablegen
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        # Ohne die Datei bekommt die Android-App keinen Push-Token; app.json
        # verweist auf sie, prebuild bricht ab, wenn sie fehlt.
        run: python3 .github/scripts/google-services.py mobile/google-services.json "$PACKAGE"

      - name: Natives Projekt erzeugen
        working-directory: mobile
        env:
          EXPO_PUBLIC_PB_URL: ${{ inputs.backend }}
        run: |
          # android/ liegt nicht im Repo — Expo erzeugt es aus app.json.
          if [ -z "$EXPO_PUBLIC_PB_URL" ]; then
            export EXPO_PUBLIC_PB_URL="https://pb.xn--plietsche-plnn-rsb.de"
          fi
          echo "Backend: $EXPO_PUBLIC_PB_URL"
          echo "EXPO_PUBLIC_PB_URL=$EXPO_PUBLIC_PB_URL" >> .env
          npx expo prebuild --platform android --clean --no-install

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes Paket bauen
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Signierung einhängen statt ins Repo schreiben, die Zugangsdaten bleiben aus dem Quelltext.
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/android-signing.py"
          # Als Aufrufparameter, damit nichts in einer Datei liegen bleibt; ohne die Angaben lief der Build über 40 Minuten.
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
          ./gradlew bundleRelease --no-daemon --build-cache \
            "-PPP_KEYSTORE_PATH=/tmp/release.jks" \
            "-PPP_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PPP_KEY_ALIAS=$KEY_ALIAS" \
            "-PPP_KEY_PASSWORD=$KEY_PASS"
          ls -la app/build/outputs/bundle/release/

      - name: Letzten veroeffentlichten Stand ermitteln
        id: vorher
        env:
          GH_TOKEN: ${{ github.token }}
        # Letzter veröffentlichter Commit dieses Branches ohne Probeläufe; kein Tag, weil der Token keine Referenz auf Workflow-Dateien setzen darf.
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/play-internal.yml/runs?status=success&branch=${GITHUB_REF_NAME}&per_page=50" \
            | python3 -c "
          import json, sys
          for run in json.load(sys.stdin).get('workflow_runs') or []:
              if '[Probelauf]' in (run.get('display_title') or ''):
                  continue
              print(run.get('head_sha', ''))
              break
          ")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Letzter veroeffentlichter Stand: ${SHA:-keiner}"

      - name: Testhinweise zusammenstellen
        id: hinweise
        env:
          VORGABE: ${{ inputs.hinweis }}
          SEIT_COMMIT: ${{ steps.vorher.outputs.sha }}
        run: |
          python3 .github/scripts/release-notes.py play > /tmp/notes.txt
          {
            echo 'text<<HINWEIS_ENDE'
            cat /tmp/notes.txt
            echo 'HINWEIS_ENDE'
          } >> "$GITHUB_OUTPUT"
          echo "--- Testhinweise ---"
          cat /tmp/notes.txt

      - name: Paket für den Upload bereitstellen
        run: |
          AAB=$(find mobile/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Paket: $AAB"
          mkdir -p "$RUNNER_TEMP/aab" && cp "$AAB" "$RUNNER_TEMP/aab/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aab
          path: ${{ runner.temp }}/aab/
          if-no-files-found: error
          retention-days: 1

  upload:
    # Baustein prüft vorab, wiederholt bei 5xx und verwirft bei Fehlern.
    needs: [build]
    uses: Revisor01/workflows/.github/workflows/play-upload.yml@97284908c8f72a4e54b593e2c43b56377eda0606 # 1.4.0
    with:
      paket: de.godsapp.plietschepluenn
      tracks: ${{ inputs.spur }}
      status: ${{ inputs.freigabe }}
      production-anteil: "1"
      release-notes: ${{ needs.build.outputs.hinweise }}
      artefakt: aab
      dry-run: ${{ inputs.probelauf }}
    secrets:
      dienstkonto: ${{ secrets.GPLAY_SA_JSON_BASE64 }}

  zusammenfassung:
    needs: [build, upload]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zusammenfassung
        env:
          VERSION_CODE: ${{ needs.build.outputs.code }}
          HINWEISE: ${{ needs.build.outputs.hinweise }}
          UPLOAD: ${{ needs.upload.result }}
          SPUR: ${{ inputs.spur }}
          PROBELAUF: ${{ inputs.probelauf }}
          FREIGABE: ${{ inputs.freigabe }}
        run: |
          {
            echo "## Google Play"
            echo ""
            if [ "$UPLOAD" != "success" ]; then
              echo "**Nicht hochgeladen** (Upload: ${UPLOAD})."
            elif [ "$PROBELAUF" = "true" ]; then
              echo "**Probelauf** — nichts veroeffentlicht, Nummer unverbraucht."
            else
              echo "**versionCode ${VERSION_CODE}** in Spur \`${SPUR}\`, aus \`${GITHUB_SHA:0:7}\`"
              echo ""
              if [ "$FREIGABE" = "draft" ]; then
                echo "Status **Entwurf** — liegt in der Play Console und geht erst"
                echo "los, wenn du es dort freigibst."
              else
                echo "Status **freigegeben** — Google startet die Pruefung selbst."
              fi
            fi
            echo ""
            echo "### Zu testen"
            echo ""
            echo "${HINWEISE:-–}"
          } >> "$GITHUB_STEP_SUMMARY"
