name: Google Play

# Der Titel des Laufs traegt bei einem Probelauf die Marke [Probelauf]. Daran
# erkennt der Schritt "Letzten veroeffentlichten Stand ermitteln" die Laeufe,
# die nichts veroeffentlicht haben, und ueberspringt sie — sonst verschoebe ein
# Probelauf den Vergleichsstand fuer die Release-Notes.
run-name: >-
  ${{ inputs.probelauf && '[Probelauf] ' || '' }}Google Play ${{ inputs.spur }}

# Baut den aktuellen Stand von main als signiertes Android-Paket und laedt es
# in eine Testspur bei Google Play. Gegenstueck zum TestFlight-Workflow, nur
# ohne Mac — Android baut auf einem gewoehnlichen Linux-Runner.
#
# Der Dry-Run laeuft komplett durch (Bauen, Hochladen, Spur setzen, pruefen),
# verwirft am Ende aber die Play-Bearbeitung. Nichts wird veroeffentlicht, und
# die Versionsnummer bleibt unverbraucht — zum gefahrlosen Ausprobieren.

on:
  workflow_dispatch:
    inputs:
      spur:
        description: 'Ziel-Spur bei Google Play'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      freigabe:
        description: 'completed = geht sofort an die Spur. draft = landet als Entwurf in der Play Console (noetig, solange die App dort noch nie veroeffentlicht wurde).'
        type: choice
        options:
          - completed
          - draft
        # Vorgabe bleibt completed: Der interne Weg laeuft seit Monaten so, und
        # ein stillschweigender Wechsel auf draft haette Testfassungen unbemerkt
        # in der Konsole liegen lassen, statt sie an die Tester:innen zu geben.
        # draft wird deshalb bewusst gewaehlt — vor allem fuer die erste
        # Einreichung in die Produktionsspur, die Google anders gar nicht
        # annimmt ("Only releases with status draft may be created on draft app.").
        default: completed
      hinweis:
        description: 'Was soll getestet werden? (leer = aus den Commits erzeugt)'
        required: false
        default: ''
      backend:
        description: 'Backend-Adresse (leer = Produktion)'
        required: false
        default: ''
      probelauf:
        description: 'Probelauf: alles bauen und pruefen, aber nichts veroeffentlichen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play
  cancel-in-progress: false

env:
  PACKAGE: de.godsapp.plietschepluenn

jobs:
  build:
    name: Bauen und hochladen
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle-Zwischenspeicher
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Node einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Naechste Versionsnummer ermitteln
        id: version
        env:
          GPLAY_SA_JSON_BASE64: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
          PROBELAUF: ${{ inputs.probelauf }}
        # Die Nummer kommt aus Google Play, nicht aus dem Repo — dort muss sie
        # eindeutig aufsteigen. Im Probelauf wird sie kuenstlich hochgesetzt,
        # damit der Upload nicht an einer schon vergebenen Nummer scheitert;
        # verbraucht wird sie nicht, die Bearbeitung wird ja verworfen.
        run: |
          echo "$GPLAY_SA_JSON_BASE64" | base64 --decode > /tmp/gplay-sa.json
          python3 .github/scripts/play-version.py /tmp/gplay-sa.json "$PACKAGE" \
            >> "$GITHUB_OUTPUT"

      - name: Version und Nummer eintragen
        working-directory: mobile
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('app.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          code = int(os.environ['VERSION_CODE'])
          if os.environ.get('PROBELAUF') == 'true':
              # Weit nach oben, damit der Upload nicht an einer bereits
              # vergebenen Nummer scheitert. Wird nie veroeffentlicht.
              code += 10000
          d['expo'].setdefault('android', {})['versionCode'] = code
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f"Version {d['expo']['version']} (versionCode {code})")
          PY

      - name: Natives Projekt erzeugen
        working-directory: mobile
        env:
          EXPO_PUBLIC_PB_URL: ${{ inputs.backend }}
        run: |
          # android/ liegt nicht im Repo — Expo erzeugt es aus app.json.
          if [ -z "$EXPO_PUBLIC_PB_URL" ]; then
            export EXPO_PUBLIC_PB_URL="https://pb.xn--plietsche-plnn-rsb.de"
          fi
          echo "Backend: $EXPO_PUBLIC_PB_URL"
          echo "EXPO_PUBLIC_PB_URL=$EXPO_PUBLIC_PB_URL" >> .env
          npx expo prebuild --platform android --clean --no-install

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes Paket bauen
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Expo erzeugt eine Gradle-Konfiguration ohne Signaturangaben. Sie
        # werden hier eingehaengt, statt sie ins Repo zu schreiben — die
        # Zugangsdaten sollen nirgends im Quelltext stehen.
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/android-signing.py"
          # Die Werte als Aufrufparameter statt ueber gradle.properties: So
          # stehen sie sicher am :app-Projekt an und landen nirgends in einer
          # Datei, die im Arbeitsverzeichnis liegen bleibt.
          # Ohne diese Angaben laeuft der Build auf dem Runner in eine
          # zaehe Einzelspur — der erste Versuch stand nach 40 Minuten
          # immer noch beim Uebersetzen.
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
          ./gradlew bundleRelease --no-daemon --build-cache \
            "-PPP_KEYSTORE_PATH=/tmp/release.jks" \
            "-PPP_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PPP_KEY_ALIAS=$KEY_ALIAS" \
            "-PPP_KEY_PASSWORD=$KEY_PASS"
          ls -la app/build/outputs/bundle/release/

      - name: Letzten veroeffentlichten Stand ermitteln
        id: vorher
        env:
          GH_TOKEN: ${{ github.token }}
        # Der Commit des letzten Laufs, der tatsaechlich veroeffentlicht hat.
        # Ein Git-Tag scheidet aus: Der eingebaute Token darf keine Referenz
        # setzen, die auf Workflow-Dateien zeigt.
        #
        # Der Branch gehoert in die Abfrage: Ohne ihn zaehlt auch ein Lauf von
        # einem Nebenzweig als Vergleichsstand, und die Hinweise entstuenden
        # dann aus einem Bereich, der mit diesem Zweig nichts zu tun hat.
        #
        # Probelaeufe scheiden ebenfalls aus: Sie verwerfen die Play-Bearbeitung
        # und veroeffentlichen nichts, enden aber mit Erfolg. Zaehlten sie mit,
        # gaelte der Commit des Probelaufs beim naechsten echten Lauf als
        # "zuletzt ausgeliefert" — alle Aenderungen bis dahin fielen aus den
        # Hinweisen heraus, obwohl sie nie bei einem Menschen angekommen sind.
        # Erkennbar sind sie an der Marke [Probelauf] im Titel (siehe run-name).
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/play-internal.yml/runs?status=success&branch=${GITHUB_REF_NAME}&per_page=50" \
            | python3 -c "
          import json, sys
          for run in json.load(sys.stdin).get('workflow_runs') or []:
              if '[Probelauf]' in (run.get('display_title') or ''):
                  continue
              print(run.get('head_sha', ''))
              break
          ")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Letzter veroeffentlichter Stand: ${SHA:-keiner}"

      - name: Testhinweise zusammenstellen
        id: hinweise
        env:
          VORGABE: ${{ inputs.hinweis }}
          SEIT_COMMIT: ${{ steps.vorher.outputs.sha }}
        run: |
          python3 .github/scripts/release-notes.py play > /tmp/notes.txt
          {
            echo 'text<<HINWEIS_ENDE'
            cat /tmp/notes.txt
            echo 'HINWEIS_ENDE'
          } >> "$GITHUB_OUTPUT"
          echo "--- Testhinweise ---"
          cat /tmp/notes.txt

      - name: Zu Google Play hochladen
        env:
          SPUR: ${{ inputs.spur }}
          PROBELAUF: ${{ inputs.probelauf }}
          PLAY_RELEASE_STATUS: ${{ inputs.freigabe }}
        run: |
          AAB=$(ls mobile/android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "Paket: $AAB"
          python3 .github/scripts/upload-play.py /tmp/gplay-sa.json "$AAB" \
            /tmp/notes.txt "$SPUR" \
            "$([ "$PROBELAUF" = "true" ] && echo validate || echo commit)"

      - name: Zusammenfassung
        if: always()
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          HINWEISE: ${{ steps.hinweise.outputs.text }}
          SPUR: ${{ inputs.spur }}
          PROBELAUF: ${{ inputs.probelauf }}
          FREIGABE: ${{ inputs.freigabe }}
        run: |
          {
            echo "## Google Play"
            echo ""
            if [ "$PROBELAUF" = "true" ]; then
              echo "**Probelauf** — nichts veroeffentlicht, Nummer unverbraucht."
            else
              echo "**versionCode ${VERSION_CODE}** in Spur \`${SPUR}\`, aus \`${GITHUB_SHA:0:7}\`"
              echo ""
              if [ "$FREIGABE" = "draft" ]; then
                echo "Status **Entwurf** — liegt in der Play Console und geht erst"
                echo "los, wenn du es dort freigibst."
              else
                echo "Status **freigegeben** — Google startet die Pruefung selbst."
              fi
            fi
            echo ""
            echo "### Zu testen"
            echo ""
            echo "${HINWEISE:-–}"
          } >> "$GITHUB_STEP_SUMMARY"
