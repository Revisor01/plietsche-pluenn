  <!-- Plietsche Pluenn — P2 im Ring.
       Schrift: Work Sans Black (900), dieselbe Familie wie die App.
       Die Buchstaben sind als Konturen eingebettet; die Datei braucht
       daher keine installierte Schrift.
       Die Ringstaerke entspricht der gemessenen Stammbreite des P
       (164 von 462 Einheiten Versalhoehe). Ring und Zeichen wirken
       dadurch gleich fett — wer die eine Groesse aendert, aendert die
       andere mit, sonst kippt das Verhaeltnis. -->
