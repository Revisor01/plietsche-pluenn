<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Plietsche Pluenn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Plietsche Pluenn</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2bb091"></stop>
      <stop offset="0.52" stop-color="#79c3b0"></stop>
      <stop offset="1" stop-color="#80b3e1"></stop>
    </linearGradient>
    <radialGradient id="keyLight" cx="0.14" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#fffffb" stop-opacity="0.24"></stop>
      <stop offset="1" stop-color="#fffffb" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="vignette" cx="0.88" cy="0.96" r="0.58">
      <stop offset="0" stop-color="#0a2c3a" stop-opacity="0.2"></stop>
      <stop offset="1" stop-color="#0a2c3a" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffffb" stop-opacity="0.38"></stop>
      <stop offset="1" stop-color="#fffffb" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="bounce" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fffffb" stop-opacity="0.2"></stop>
      <stop offset="1" stop-color="#fffffb" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffffb" stop-opacity="1"></stop>
      <stop offset="0.45" stop-color="#fffffb" stop-opacity="0.78"></stop>
      <stop offset="1" stop-color="#fffffb" stop-opacity="0.94"></stop>
    </linearGradient>

    <filter id="castBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"></feGaussianBlur>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"></feGaussianBlur>
    </filter>
    <filter id="discShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a2c3a" flood-opacity="0.1"></feDropShadow>
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0a2c3a" flood-opacity="0.13"></feDropShadow>
      <feDropShadow dx="0" dy="46" stdDeviation="44" flood-color="#0a2c3a" flood-opacity="0.17"></feDropShadow>
    </filter>
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="2" flood-color="#0a2c3a" flood-opacity="0.14"></feDropShadow>
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0a2c3a" flood-opacity="0.18"></feDropShadow>
    </filter>

    <clipPath id="discClip"><circle cx="512" cy="512" r="344"></circle></clipPath>
    <clipPath id="corners"><rect width="1024" height="1024" rx="224" ry="224"></rect></clipPath>
  </defs>


  
  <rect width="1024" height="1024" fill="url(#bg)"></rect>
  <rect width="1024" height="1024" fill="url(#keyLight)"></rect>
  <rect width="1024" height="1024" fill="url(#vignette)"></rect>

  
  <ellipse cx="528" cy="832" rx="272" ry="140" fill="#0a2c3a" fill-opacity="0.2" filter="url(#castBlur)"></ellipse>

  
  <g filter="url(#discShadow)">
    <circle cx="512" cy="512" r="344" fill="#fffffb" fill-opacity="0.22"></circle>
    <circle cx="512" cy="512" r="344" fill="none" stroke="url(#rim)" stroke-width="12"></circle>
  </g>
  <g clip-path="url(#discClip)">
    <ellipse cx="512" cy="286" rx="224" ry="120" fill="url(#gloss)" filter="url(#softBlur)"></ellipse>
    <ellipse cx="512" cy="800" rx="170" ry="62" fill="url(#bounce)" filter="url(#softBlur)"></ellipse>
  </g>

  
  <g fill="#fffffb" filter="url(#markShadow)">
    <path fill-rule="evenodd" d="M 352 338 H 394 A 147.5 97.4 0 0 1 394 533 H 394 V 687 H 352 Z M 394 381 A 105 54.9 0 0 1 394 491 Z"></path>
    <path d="M 574.7 408.2 C 574.7 365.7 624.1 351.5 657.1 366.9 C 694.9 383.4 694.9 427 668.9 453 C 640.6 481.3 598.1 495.5 574.7 512 L 692.5 512" fill="none" stroke="#fffffb" stroke-width="19" stroke-linejoin="round"></path>
  </g>

</svg>