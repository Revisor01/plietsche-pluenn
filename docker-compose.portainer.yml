# Produktionsfassung des Stacks: eigenes Abbild aus pocketbase/Dockerfile mit Hooks und Migrationen, gemountet wird nur pb_data.

services:
  pocketbase:
    image: ghcr.io/revisor01/plietsche-pluenn/pocketbase:latest
    container_name: plietsche-pocketbase
    restart: unless-stopped
    command:
      - "--encryptionEnv=PB_ENCRYPTION_KEY"
      - "--http=0.0.0.0:8090"
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      # Nur für Cron-Uhrzeiten und Logs; Tage und Wochen rechnet die Fachlogik aus store.timezone.
      TZ: Europe/Berlin
    volumes:
      # Nur die Daten, Mounts auf Hooks oder Migrationen überdeckten das Abbild; absolut, weil Portainer ein eigenes Arbeitsverzeichnis nutzt.
      - /opt/stacks/plietsche-pb/pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Grenzen für den geteilten Host; ohne max-size füllt das Protokoll die Platte.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Bedarf am 14.09.2026: 19,6 MB; 512 MB fangen nur ein Weglaufen ab.
    mem_limit: 512m
    cpus: 1.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plietsche-pb.rule=Host(`pb.xn--plietsche-plnn-rsb.de`)"
      - "traefik.http.services.plietsche-pb.loadbalancer.server.port=8090"
    networks:
      - traefik

networks:
  traefik:
    external: true
