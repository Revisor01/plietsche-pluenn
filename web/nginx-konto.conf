server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Die Links aus den System-Mails haben die Form
    #   /_/#/auth/confirm-<fall>/<token>
    # PocketBase baut sie fest so zusammen; {ACTION_URL} ist in den Vorlagen
    # Pflicht und laesst sich nicht durch eine eigene Adresse ersetzen. Weil
    # appUrl auf diese Webseite zeigt, landen die Leute hier. Der Teil hinter
    # der Raute erreicht den Server nie — deshalb genuegt es, /_/ auf die
    # Seite zu legen; Fall und Token liest sie selbst aus dem Fragment.
    location /_/ {
        try_files $uri /konto.html;
    }

    # Eigener, sprechender Weg — falls jemand den Link von Hand tippt.
    location /konto {
        try_files $uri /konto.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
