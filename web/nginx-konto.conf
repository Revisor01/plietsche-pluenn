server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mail-Links /_/#/auth/confirm-<fall>/<token>: das Fragment erreicht den Server nie, /_/ auf die Seite legen genuegt.
    location /_/ {
        try_files $uri /konto.html;
    }

    # Eigener, sprechender Weg — falls jemand den Link von Hand tippt.
    location /konto {
        try_files $uri /konto.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
